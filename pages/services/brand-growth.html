<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand & Digital Growth | Medhavat</title>
    <link rel="stylesheet" href="../../src/styles/tokens.css" />
    <link rel="stylesheet" href="../../src/styles/service-page.css" />
    <!-- Temporary icon CDN; vendor the used subset before production. -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="service-page">
    <header class="site-header" data-site-header></header>
    <section class="service-hero">
      <canvas
        class="service-canvas"
        id="service-canvas"
        aria-hidden="true"
      ></canvas>
      <main>
        <section class="service-copy" aria-labelledby="service-title">
          <p class="service-kicker">Medhavat / Service 04</p>
          <h1 class="service-title" id="service-title">
            Brand &amp; Digital Growth
          </h1>
          <p class="service-answer" data-answer>
            Medhavat combines branding, technical SEO, optimized performance,
            data analytics, and continuous support to turn digital presence into
            measurable business growth.
          </p>
          <div
            class="service-capabilities"
            aria-label="Brand and growth capabilities"
          >
            <span class="space-icon"
              ><i class="fa-solid fa-meteor" aria-hidden="true"></i>Branding
            </span>
            <span class="space-icon"
              ><i class="fa-solid fa-satellite-dish" aria-hidden="true"></i
              >Technical SEO</span
            >
            <span class="space-icon"
              ><i class="fa-solid fa-atom" aria-hidden="true"></i>Digital
              Marketing</span
            >
            <span class="space-icon"
              ><i class="fa-solid fa-chart-line" aria-hidden="true"></i>Data
              Analytics</span
            >
            <span class="space-icon"
              ><i class="fa-solid fa-rocket" aria-hidden="true"></i>Continuous
              Support</span
            >
          </div>
        </section>
      </main>
    </section>
    <main class="service-content">
      <section
        class="service-details"
        data-service-details
        aria-label="Brand growth capabilities"
      ></section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script type="module" src="../../src/service-brand-entry.js"></script>
  </body>
</html>
