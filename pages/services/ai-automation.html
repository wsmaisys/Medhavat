<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI & Intelligent Automation | Medhavat</title>
    <link rel="stylesheet" href="../../src/styles/tokens.css" />
    <link rel="stylesheet" href="../../src/styles/service-page.css" />
    <!-- Temporary icon CDN; vendor the used subset before production. -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="service-page">
    <header class="site-header" data-site-header></header>
    <canvas
      class="service-canvas"
      id="service-canvas"
      aria-hidden="true"
    ></canvas>
    <main>
      <section class="service-copy" aria-labelledby="service-title">
        <p class="service-kicker">Medhavat / Service 01</p>
        <h1 class="service-title" id="service-title">
          AI &amp; Intelligent Automation
        </h1>
        <p class="service-answer" data-answer>
          Medhavat turns complex workflows into intelligent systems through
          bespoke AI agents, RAG document processing, predictive analytics, and
          process automation.
        </p>
        <div class="service-capabilities" aria-label="AI service capabilities">
          <span class="space-icon"
            ><i class="fa-solid fa-satellite-dish" aria-hidden="true"></i>AI
            agents</span
          >
          <span class="space-icon"
            ><i class="fa-solid fa-atom" aria-hidden="true"></i>RAG
            systems</span
          >
          <span class="space-icon"
            ><i class="fa-solid fa-meteor" aria-hidden="true"></i>Predictive
            analytics</span
          >
          <span class="space-icon"
            ><i class="fa-solid fa-rocket" aria-hidden="true"></i
            >Automation</span
          >
        </div>
      </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script type="module" src="../../src/service-ai-entry.js"></script>
  </body>
</html>
