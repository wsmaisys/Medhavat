<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Experience & Web | Medhavat</title>
    <link rel="stylesheet" href="../../src/styles/tokens.css" />
    <link rel="stylesheet" href="../../src/styles/service-page.css" />
    <!-- Temporary icon CDN; vendor the used subset before production. -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="service-page">
    <header class="site-header" data-site-header></header>
    <canvas
      class="service-canvas"
      id="service-canvas"
      aria-hidden="true"
    ></canvas>
    <main>
      <section class="service-copy" aria-labelledby="service-title">
        <p class="service-kicker">Medhavat / Service 02</p>
        <h1 class="service-title" id="service-title">
          Digital Experience &amp; Web
        </h1>
        <p class="service-answer" data-answer>
          Medhavat engineers high-speed, conversion-optimized web platforms,
          e-commerce experiences, progressive web apps, and focused UI/UX
          redesigns.
        </p>
        <div
          class="service-capabilities"
          aria-label="Digital experience capabilities"
        >
          <span class="space-icon"
            ><i class="fa-solid fa-satellite" aria-hidden="true"></i>Web
            platforms</span
          >
          <span class="space-icon"
            ><i class="fa-solid fa-rocket" aria-hidden="true"></i
            >E-commerce</span
          >
          <span class="space-icon"
            ><i class="fa-solid fa-atom" aria-hidden="true"></i>Progressive web
            apps</span
          >
          <span class="space-icon"
            ><i class="fa-solid fa-meteor" aria-hidden="true"></i>UI/UX
            redesign</span
          >
        </div>
      </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script type="module" src="../../src/service-web-entry.js"></script>
  </body>
</html>
