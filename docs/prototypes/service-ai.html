<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI & Intelligent Automation | Medhavat</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #dcecf4;
        --muted: rgba(220, 236, 244, 0.68);
        --cyan: #4fe0ff;
        --purple: #b266ff;
        --blue: #5f9fd1;
        --night: #020509;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--night);
      }
      body {
        font-family: "Century Gothic", "Trebuchet MS", sans-serif;
      }
      #service-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .service-copy {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 1;
        width: min(28rem, 42vw);
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
      }
      .service-kicker {
        margin: 0 0 1rem;
        color: var(--cyan);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        color: var(--ink);
        font-size: clamp(2rem, 4vw, 4.4rem);
        line-height: 0.98;
        letter-spacing: 0;
        text-shadow:
          0 0 26px rgba(79, 224, 255, 0.24),
          0 0 54px rgba(178, 102, 255, 0.16);
      }
      .service-copy p:last-child {
        margin: 1.25rem 0 0;
        color: var(--muted);
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.85rem;
        line-height: 1.5;
      }
      @media (max-width: 700px) {
        .service-copy {
          width: min(72vw, 22rem);
        }
        h1 {
          font-size: 2.35rem;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="service-canvas"></canvas>
    <section class="service-copy" aria-label="AI and Intelligent Automation">
      <p class="service-kicker">Medhavat / Service 01</p>
      <h1>AI &amp; Intelligent Automation</h1>
      <p>Neural patterns evolving into a new digital identity.</p>
    </section>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js" } }
    </script>
    <script type="module" src="./service-ai.js"></script>
  </body>
</html>
