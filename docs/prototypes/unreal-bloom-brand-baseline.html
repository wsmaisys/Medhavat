<!doctype html>
<html lang="en">
  <head>
    <title>Medhavat | Unreal Bloom</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <meta
      property="og:title"
      content="three.js webgl - postprocessing - unreal bloom"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://threejs.org/examples/webgl_postprocessing_unreal_bloom.html"
    />
    <meta
      property="og:image"
      content="https://threejs.org/examples/screenshots/webgl_postprocessing_unreal_bloom.jpg"
    />
    <link type="text/css" rel="stylesheet" href="main.css" />
    <style>
      #info > * {
        max-width: 650px;
        margin-left: auto;
        margin-right: auto;
      }
      .hero-copy {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 2;
        width: min(34vw, 360px);
        transform: translate(-50%, -50%);
        color: #f8fafc;
        font-family: "Century Gothic", "Trebuchet MS", sans-serif;
        text-align: center;
        pointer-events: none;
      }
      .hero-kicker {
        margin: 0 0 14px;
        color: #4fe0ff;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .hero-title {
        margin: 0;
        font-size: 2.15rem;
        line-height: 1.06;
        font-weight: 700;
        text-wrap: balance;
        text-shadow: 0 0 18px rgba(0, 210, 255, 0.28);
      }
      .hero-subtitle {
        margin: 18px 0 0;
        color: rgba(220, 236, 244, 0.72);
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.82rem;
        line-height: 1.4;
      }
      @media (max-width: 800px) {
        .hero-copy {
          width: min(56vw, 300px);
        }
        .hero-title {
          font-size: 1.7rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <section class="hero-copy" aria-label="Medhavat introduction">
      <p class="hero-kicker">Medhavat</p>
      <h1 class="hero-title">
        Transforming Business Ambition into Intelligent Software.
      </h1>
      <p class="hero-subtitle">Intellectual Tech. Real Business Growth.</p>
    </section>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";

      import { OrbitControls } from "./vendor/three/OrbitControls.js";
      import { GLTFLoader } from "./vendor/three/GLTFLoader.js";
      import { EffectComposer } from "./vendor/three/EffectComposer.js";
      import { RenderPass } from "./vendor/three/RenderPass.js";
      import { UnrealBloomPass } from "./vendor/three/UnrealBloomPass.js";
      import { OutputPass } from "./vendor/three/OutputPass.js";

      let camera;
      let composer, renderer, mixer, timer;

      const params = {
        threshold: 0,
        strength: 1,
        radius: 0.5,
        exposure: 1,
      };

      init();

      async function init() {
        const container = document.getElementById("container");

        timer = new THREE.Clock();

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020509);

        camera = new THREE.PerspectiveCamera(
          40,
          window.innerWidth / window.innerHeight,
          1,
          100,
        );
        camera.position.set(-5, 2.5, -3.5);
        scene.add(camera);

        scene.add(new THREE.AmbientLight(0x789eaa, 0.35));

        const pointLight = new THREE.PointLight(0x4fe0ff, 18, 28);
        camera.add(pointLight);

        const loader = new GLTFLoader();
        const gltf = await loader.loadAsync(
          "./vendor/three/models/gltf/PrimaryIonDrive.glb",
        );

        const model = gltf.scene;
        model.traverse(function (object) {
          if (object.isMesh && object.name.startsWith("geo1")) {
            object.visible = false;
            return;
          }
          if (object.isMesh && object.material) {
            const materials = Array.isArray(object.material)
              ? object.material
              : [object.material];
            materials.forEach(function (material) {
              const isDarkFill = material.name === "HoloFillDark";
              material.color.setHex(isDarkFill ? 0x0f172a : 0x00d2ff);
              if (material.emissive) {
                material.emissive.setHex(0x00d2ff);
                material.emissiveIntensity = isDarkFill ? 0.03 : 0.2;
              }
            });
          }
        });
        model.scale.x = 1.5;
        scene.add(model);

        mixer = new THREE.AnimationMixer(model);
        const clip = gltf.animations[0];
        mixer.clipAction(clip.optimize()).play();

        //

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setAnimationLoop(animate);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        //

        const renderScene = new RenderPass(scene, camera);

        const bloomPass = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          0.45,
          0.6,
          0.2,
        );
        bloomPass.threshold = 0.2;
        bloomPass.strength = 0.45;
        bloomPass.radius = params.radius;

        const outputPass = new OutputPass();

        composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);
        composer.addPass(outputPass);

        //

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.maxPolarAngle = Math.PI * 0.5;
        controls.minDistance = 3;
        controls.maxDistance = 8;

        //

        window.addEventListener("resize", onWindowResize);
      }

      function onWindowResize() {
        const width = window.innerWidth;
        const height = window.innerHeight;

        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
        composer.setSize(width, height);
      }

      function animate() {
        const delta = timer.getDelta();

        mixer.update(delta);

        composer.render();
      }
    </script>
  </body>
</html>
